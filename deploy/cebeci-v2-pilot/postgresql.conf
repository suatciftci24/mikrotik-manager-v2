# REVIEW ONLY. Only the new, dedicated V2 cluster reads this configuration.
listen_addresses = '127.0.0.1'
port = 55432
unix_socket_directories = '/srv/mikrotik-manager-v2-pilot/postgres-socket'
unix_socket_permissions = 0700
hba_file = '/srv/mikrotik-manager-v2-pilot/config/postgres/pg_hba.conf'
ident_file = '/srv/mikrotik-manager-v2-pilot/config/postgres/pg_ident.conf'
password_encryption = 'scram-sha-256'
timezone = 'UTC'
log_timezone = 'UTC'
log_destination = 'stderr'
logging_collector = off
log_statement = 'none'
log_min_error_statement = panic
log_error_verbosity = terse
log_parameter_max_length = 0
log_parameter_max_length_on_error = 0
log_connections = off
log_disconnections = off
