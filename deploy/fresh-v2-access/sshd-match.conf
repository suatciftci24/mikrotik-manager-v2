# PREPARED ONLY: append as a reviewed Match block after global settings.
Match User v2-fresh-ops
    AuthenticationMethods publickey
    PubkeyAuthentication yes
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AuthorizedKeysFile /etc/ssh/authorized_keys/v2-fresh-ops
    ForceCommand /usr/local/sbin/mikrotik-v2-fresh-ssh
    DisableForwarding yes
    PermitTTY no
    PermitUserRC no
    PermitUserEnvironment no
    X11Forwarding no
    MaxSessions 1
Match all
